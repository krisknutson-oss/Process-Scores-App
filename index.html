<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Process Score Daily Checker</title>
    <meta name="description" content="Process Score Daily Checker - Learning Skills Tracker with Firestore backend" />
    <!-- Extension collision protection script -->
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          if (event && event.message && (
            event.message.indexOf('ethereum') !== -1 ||
            event.message.indexOf('Cannot redefine property') !== -1 ||
            (event.filename && (event.filename.indexOf('chrome-extension') !== -1 || event.filename.indexOf('moz-extension') !== -1))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).indexOf('ethereum') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
